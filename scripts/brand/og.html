<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0b1120;
        font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }
      .wrap {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 76px 84px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .word {
        font-size: 20px;
        letter-spacing: 1px;
        color: #94a3b8;
      }
      h1 {
        margin: 0;
        font-size: 60px;
        line-height: 1.28;
        font-weight: 500;
        color: #e8eaef;
        letter-spacing: 1px;
      }
      p {
        margin: 26px 0 0;
        font-size: 26px;
        line-height: 1.6;
        color: #94a3b8;
      }
      .foot {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 20px;
        color: #64748b;
      }
      .rule {
        width: 46px;
        height: 3px;
        background: #4c6ef5;
        border-radius: 2px;
      }
      .ghost {
        position: absolute;
        right: -40px;
        bottom: -60px;
        opacity: 0.07;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">
        <svg viewBox="0 0 96 96" width="56" height="56">
          <rect x="24" y="20" width="8" height="56" rx="4" fill="#4C6EF5" />
          <rect x="42" y="22" width="34" height="8" rx="4" fill="#F3F4F6" />
          <rect x="42" y="44" width="25" height="8" rx="4" fill="#9CA3AF" />
          <rect x="42" y="66" width="16" height="8" rx="4" fill="#6B7280" />
        </svg>
        <span class="word">JAVA 后端面试复习手册</span>
      </div>

      <div>
        <h1>Java 后端面试<br />系统化复习手册</h1>
        <p>13 章正文 · 261 道题 · 按「结论 → 原理 → 取舍」组织</p>
      </div>

      <div class="foot">
        <span class="rule"></span>
        <span>ramen1024.github.io/java-backend-interview-handbook</span>
      </div>

      <svg class="ghost" viewBox="0 0 96 96" width="420" height="420">
        <rect x="24" y="20" width="8" height="56" rx="4" fill="#4C6EF5" />
        <rect x="42" y="22" width="34" height="8" rx="4" fill="#F3F4F6" />
        <rect x="42" y="44" width="25" height="8" rx="4" fill="#9CA3AF" />
        <rect x="42" y="66" width="16" height="8" rx="4" fill="#6B7280" />
      </svg>
    </div>
  </body>
</html>
